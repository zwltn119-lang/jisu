<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말랑말랑 우리 반 체크리스트 📝</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        }

        body {
            background-color: #f0f7f4; /* 부드러운 파스텔 민트/그린 톤 배경 */
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 35px;
            border: 4px solid #c2e1d3;
            box-shadow: 0 12px 30px rgba(194, 225, 211, 0.5);
            padding: 30px;
        }

        /* 헤더 & 대시보드 */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            color: #3b604e;
            margin-bottom: 15px;
        }

        .dashboard {
            background: #f9fbf9;
            border: 2px dashed #b5dad1;
            border-radius: 20px;
            padding: 15px;
            display: inline-flex;
            gap: 20px;
            align-items: center;
            font-weight: bold;
            color: #4a6b5b;
        }

        .counter {
            font-size: 1.1rem;
        }

        .counter span {
            color: #ff7675;
            font-size: 1.3rem;
        }

        /* 전체 선택 / 해제 버튼 */
        .btn-all {
            background-color: #b5dad1;
            color: #3b604e;
            border: none;
            padding: 6px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-all:hover {
            background-color: #9ecbbf;
        }

        /* 학생 그리드 (30명 배치) */
        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        /* 학생 카드 개별 스타일 */
        .student-card {
            background: #fff;
            border: 2px solid #e2ece9;
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .student-card:hover {
            transform: translateY(-3px);
            border-color: #b5dad1;
            background-color: #f7fbf9;
        }

        /* 아기자기한 번호 표기 */
        .student-num {
            font-size: 0.8rem;
            background: #e2ece9;
            color: #5c776c;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .student-name {
            font-size: 1.05rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        /* 귀여운 커스텀 체크박스 동그라미 */
        .checkbox-circle {
            width: 24px;
            height: 24px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            transition: all 0.2s;
        }

        .checkbox-circle::after {
            content: '✓';
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            display: none;
        }

        /* 체크 완료되었을 때의 스타일 변화 (상큼한 파스텔 핑크/레드) */
        .student-card.checked {
            border-color: #ffb3b3;
            background-color: #fff5f5;
        }

        .student-card.checked .student-num {
            background: #ffb3b3;
            color: #fff;
        }

        .student-card.checked .checkbox-circle {
            background-color: #ff7675;
            border-color: #ff7675;
            box-shadow: 0 3px 6px rgba(255, 118, 117, 0.3);
        }

        .student-card.checked .checkbox-circle::after {
            display: block;
        }

        /* 저장 알림 배너 */
        .save-btn-container {
            text-align: center;
            margin-top: 25px;
        }

        .btn-save {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #e15f5e;
            transition: all 0.1s;
        }

        .btn-save:active {
            transform: translateY(4px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>✏️ 말랑말랑 우리 반 체크리스트</h1>
            <div class="dashboard">
                <div class="counter">확인된 학생: <span id="checkedCount">0</span> / 30명</div>
                <button class="btn-all" onclick="toggleAll(true)">전체 선택</button>
                <button class="btn-all" style="background:#e2ece9;" onclick="toggleAll(false)">해제</button>
            </div>
        </header>

        <div class="student-grid" id="studentGrid"></div>

        <div class="save-btn-container">
            <button class="btn-save" onclick="saveData()">내용 저장하기 💾</button>
        </div>
    </div>

    <script>
        const totalStudents = 30;
        const studentGrid = document.getElementById('studentGrid');
        const checkedCountDisplay = document.getElementById('checkedCount');

        // 페이지 로드 시 30명 카드 자동 생성
        function initList() {
            // 브라우저 로컬스토리지에 저장된 이전 데이터가 있는지 확인
            const savedData = JSON.parse(localStorage.getItem('studentChecklist')) || {};

            for (let i = 1; i <= totalStudents; i++) {
                const card = document.createElement('div');
                card.className = 'student-card';
                card.dataset.id = i;
                
                // 이전 저장 상태 복원
                if (savedData[i]) {
                    card.classList.add('checked');
                }

                // 카드 내부 구조 생성 (이름은 임의로 '학생 X'로 세팅, 필요시 수정 가능)
                card.innerHTML = `
                    <div class="student-num">${i}번</div>
                    <div class="student-name">학생 ${i}</div>
                    <div class="checkbox-circle"></div>
                `;

                // 클릭 이벤트 바인딩
                card.addEventListener('click', function() {
                    this.classList.toggle('checked');
                    updateCount();
                });

                studentGrid.appendChild(card);
            }
            updateCount();
        }

        // 선택된 학생 수 실시간 업데이트
        function updateCount() {
            const checkedCards = document.querySelectorAll('.student-card.checked');
            checkedCountDisplay.textContent = checkedCards.length;
        }

        // 전체 선택 / 전체 해제 기능
        function toggleAll(status) {
            const cards = document.querySelectorAll('.student-card');
            cards.forEach(card => {
                if (status) {
                    card.classList.add('checked');
                } else {
                    card.classList.remove('checked');
                }
            });
            updateCount();
        }

        // 현재 체크 상태 브라우저에 임시 저장하기
        function saveData() {
            const data = {};
            const cards = document.querySelectorAll('.student-card');
            cards.forEach(card => {
                data[card.dataset.id] = card.classList.contains('checked');
            });
            
            localStorage.setItem('studentChecklist', JSON.stringify(data));
            alert("🍉 체크리스트가 안전하게 저장되었습니다!");
        }

        // 초기화 실행
        initList();
    </script>
</body>
</html>
