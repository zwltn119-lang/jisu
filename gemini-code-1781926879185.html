<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말랑말랑 우리 반 체크리스트 📝</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        }

        body {
            background-color: #f0f7f4; 
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 35px;
            border: 4px solid #c2e1d3;
            box-shadow: 0 12px 30px rgba(194, 225, 211, 0.5);
            padding: 30px;
            position: relative;
        }

        /* 헤더 & 대시보드 */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            color: #3b604e;
            margin-bottom: 15px;
        }

        .dashboard {
            background: #f9fbf9;
            border: 2px dashed #b5dad1;
            border-radius: 20px;
            padding: 15px;
            display: inline-flex;
            gap: 15px;
            align-items: center;
            font-weight: bold;
            color: #4a6b5b;
            flex-wrap: wrap;
            justify-content: center;
        }

        .counter {
            font-size: 1.1rem;
        }

        .counter span {
            color: #ff7675;
            font-size: 1.3rem;
        }

        /* 버튼 기본 스타일 */
        .btn-ui {
            background-color: #b5dad1;
            color: #3b604e;
            border: none;
            padding: 6px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-ui:hover { background-color: #9ecbbf; }
        .btn-secondary { background-color: #e2ece9; }
        .btn-manage { background-color: #ffeaa7; color: #d63031; }
        .btn-manage:hover { background-color: #fddb6f; }

        /* 설정 영역 스크립트 팝업 스타일 */
        .settings-panel {
            display: none;
            background: #fff9f3;
            border: 2px solid #fcd2a5;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            animation: fadeIn 0.3s ease;
        }

        .settings-panel h3 {
            color: #bd8c5f;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .setting-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .setting-group label {
            font-size: 0.85rem;
            color: #7f8c8d;
            font-weight: bold;
        }

        .setting-group input, .setting-group textarea {
            border: 2px solid #e6d5c3;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.95rem;
            outline: none;
        }
        
        .setting-group input:focus, .setting-group textarea:focus {
            border-color: #ffb347;
        }

        /* 학생 그리드 */
        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        /* 학생 카드 개별 스타일 */
        .student-card {
            background: #fff;
            border: 2px solid #e2ece9;
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .student-card:hover {
            transform: translateY(-3px);
            border-color: #b5dad1;
            background-color: #f7fbf9;
        }

        .student-num {
            font-size: 0.8rem;
            background: #e2ece9;
            color: #5c776c;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .student-name {
            font-size: 1.05rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .checkbox-circle {
            width: 24px;
            height: 24px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
        }

        .checkbox-circle::after {
            content: '✓';
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            display: none;
        }

        /* 체크 완료 상태 */
        .student-card.checked {
            border-color: #ffb3b3;
            background-color: #fff5f5;
        }

        .student-card.checked .student-num {
            background: #ffb3b3;
            color: #fff;
        }

        .student-card.checked .checkbox-circle {
            background-color: #ff7675;
            border-color: #ff7675;
            box-shadow: 0 3px 6px rgba(255, 118, 117, 0.3);
        }

        .student-card.checked .checkbox-circle::after { display: block; }

        .save-btn-container {
            text-align: center;
            margin-top: 25px;
        }

        .btn-save {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #e15f5e;
            transition: all 0.1s;
        }

        .btn-save:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>✏️ 우리 반 체크리스트</h1>
            <div class="dashboard">
                <div class="counter">확인됨: <span id="checkedCount">0</span> / <span id="totalCountDisplay">30</span>명</div>
                <button class="btn-ui" onclick="toggleAll(true)">전체 선택</button>
                <button class="btn-ui btn-secondary" onclick="toggleAll(false)">해제</button>
                <button class="btn-ui btn-manage" onclick="toggleSettings()">⚙️ 학생 편집</button>
            </div>
        </header>

        <!-- 학생 수 및 이름 설정 패널 -->
        <div class="settings-panel" id="settingsPanel">
            <h3>⚙️ 학급 명렬표 관리</h3>
            <div class="setting-group">
                <label for="inputTotal">총 학생 수</label>
                <input type="number" id="inputTotal" min="1" max="100" value="30">
            </div>
            <div class="setting-group">
                <label for="inputNames">학생 이름 목록 (쉼표 ',' 혹은 줄바꿈으로 구분)</label>
                <textarea id="inputNames" rows="3" placeholder="홍길동, 김철수, 이영희..."></textarea>
            </div>
            <button class="btn-ui" style="background:#ffb347; color:white;" onclick="applySettings()">변경사항 적용하기</button>
        </div>

        <!-- 학생 그리드 레이아웃 -->
        <div class="student-grid" id="studentGrid"></div>

        <div class="save-btn-container">
            <button class="btn-save" onclick="saveCheckState()">체크 결과 저장하기 💾</button>
        </div>
    </div>

    <script>
        let totalStudents = 30;
        let studentNames = [];

        const studentGrid = document.getElementById('studentGrid');
        const checkedCountDisplay = document.getElementById('checkedCount');
        const totalCountDisplay = document.getElementById('totalCountDisplay');
        const settingsPanel = document.getElementById('settingsPanel');

        // 초기 데이터 로드 (로컬 스토리지 확인)
        function initClassroom() {
            // 1. 학생 수 및 이름 불러오기
            totalStudents = parseInt(localStorage.getItem('cl_totalStudents')) || 30;
            const savedNames = localStorage.getItem('cl_studentNames');
            studentNames = savedNames ? savedNames.split(',') : [];

            // 설정 인풋 세팅
            document.getElementById('inputTotal').value = totalStudents;
            document.getElementById('inputNames').value = studentNames.join(', ');

            // 2. 화면에 반영하기
            renderStudents();
        }

        // 학생 카드들을 화면에 그리기
        function renderStudents() {
            studentGrid.innerHTML = '';
            totalCountDisplay.textContent = totalStudents;

            // 저장되어 있던 오늘 자 체크인 데이터 상태 확인
            const savedChecks = JSON.parse(localStorage.getItem('cl_checkedState')) || {};

            for (let i = 1; i <= totalStudents; i++) {
                const card = document.createElement('div');
                card.className = 'student-card';
                card.dataset.id = i;

                // 기존 체크상태 복원
                if (savedChecks[i] === true) {
                    card.classList.add('checked');
                }

                // 지정된 이름이 있으면 표기, 없으면 '학생 번호'로 기본 세팅
                const nameText = studentNames[i - 1] ? studentNames[i - 1].trim() : `학생 ${i}`;

                card.innerHTML = `
                    <div class="student-num">${i}번</div>
                    <div class="student-name" title="${nameText}">${nameText}</div>
                    <div class="checkbox-circle"></div>
                `;

                // 카드 클릭 토글 토크
                card.addEventListener('click', function() {
                    this.classList.toggle('checked');
                    updateCount();
                });

                studentGrid.appendChild(card);
            }
            updateCount();
        }

        // 체크 인원수 갱신
        function updateCount() {
            const checkedCards = document.querySelectorAll('.student-card.checked');
            checkedCountDisplay.textContent = checkedCards.length;
        }

        // 전체 선택 / 해제
        function toggleAll(status) {
            const cards = document.querySelectorAll('.student-card');
            cards.forEach(card => {
                if (status) card.classList.add('checked');
                else card.classList.remove('checked');
            });
            updateCount();
        }

        // 관리 창 토글
        function toggleSettings() {
            if(settingsPanel.style.display === 'block') {
                settingsPanel.style.display = 'none';
            } else {
                settingsPanel.style.display = 'block';
            }
        }

        // 설정 패널 데이터 적용 및 브라우저 영구 저장
        function applySettings() {
            const newTotal = parseInt(document.getElementById('inputTotal').value) || 30;
            const rawNames = document.getElementById('inputNames').value;
            
            // 쉼표 혹은 줄바꿈(엔터) 기준으로 이름 쪼개기
            const newNames = rawNames.split(/[,\n]/).map(name => name.trim()).filter(name => name !== "");

            totalStudents = newTotal;
            studentNames = newNames;

            // 로컬스토리지 저장
            localStorage.setItem('cl_totalStudents', totalStudents);
            localStorage.setItem('cl_studentNames', studentNames.join(','));

            renderStudents();
            settingsPanel.style.display = 'none';
            alert("✨ 명렬표 데이터가 성공적으로 변경되었습니다!");
        }

        // 현재 체크 표시 상태만 임시 저장
        function saveCheckState() {
            const checkData = {};
            const cards = document.querySelectorAll('.student-card');
            cards.forEach(card => {
                checkData[card.dataset.id] = card.classList.contains('checked');
            });
            
            localStorage.setItem('cl_checkedState', JSON.stringify(checkData));
            alert("🍉 오늘 자 체크리스트 현황이 저장되었습니다!");
        }

        // 실행
        initClassroom();
    </script>
</body>
</html>
